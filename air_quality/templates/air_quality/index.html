{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AireVLC — Calidad del aire en València</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="{% static 'air_quality/css/main.css' %}">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>AireVLC</h1>
      <p class="subtitle">Calidad del aire en València</p>
    </header>

    <section id="controls">
      <div class="field-row">
        <label class="field">
          <span>Contaminante</span>
          <select id="pollutant">
            <option value="no2">NO₂</option>
            <option value="pm10">PM10</option>
            <option value="pm2_5">PM2.5</option>
            <option value="o3">O₃</option>
            <option value="so2">SO₂</option>
            <option value="co">CO</option>
          </select>
        </label>

        <label class="field">
          <span>Estación</span>
          <select id="station"></select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Desde</span>
          <input type="date" id="start-date">
        </label>
        <label class="field">
          <span>Hasta</span>
          <input type="date" id="end-date">
        </label>
      </div>

      <div class="presets">
        <button type="button" data-preset="1m">1 mes</button>
        <button type="button" data-preset="1y">1 año</button>
        <button type="button" data-preset="5y">5 años</button>
        <button type="button" data-preset="all">Todo</button>
      </div>

      <p id="preset-note" class="preset-note" hidden></p>

      <button type="button" id="apply" class="btn-primary">Aplicar</button>
    </section>

    <section id="stats" hidden></section>

    <section id="chart-section" hidden>
      <h2>Evolución temporal</h2>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </section>

    <footer>
      <p class="legend-title">Estaciones de medición</p>
      <p class="legend-detail" id="station-count">Cargando…</p>
    </footer>
  </aside>

  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="{% static 'air_quality/js/main.js' %}"></script>
</body>
</html>
